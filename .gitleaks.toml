# Default gitleaks rules plus the example values that its generic-api-key rule takes for secrets:
# access and idempotency keys from the API contract (openapi.yaml, 06-api-contract.md) and fixed
# values in tests. Values, not fingerprints: they hold for the git history, a fresh repository and
# `gitleaks dir` alike. Anything else is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "Documented example values"
regexTarget = "secret"
regexes = [
  '''^7K3M-Q9TB-2XRA-HC4D-P8WN-6YFE$''',
  '''^M2QF-8RZD-K4VT-1NXE-B7HC-0PAW$''',
  '''^0b8e1d3a-6d0e-4f53-9a43-2f1c7e5a9d10$''',
  '''^9b1f4c1e-5a0e-4a65-9a0b-6a2d1f0c3e11$''',
  '''^bm90LWEtdG9rZW4$''',
  '''^key-1234567890abcdef$''',
]
