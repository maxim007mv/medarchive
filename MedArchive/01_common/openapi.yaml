            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
    delete:
      operationId: workspace.delete
      summary: Удалить архив целиком (отзыв согласия)
      tags:
      - workspace
      description: Лимит 1 удаление в час на сессию считает только принятые удаления (202). Любой другой ответ (401, 403, 412, 428, 429, 500) лимит не расходует (ADR-051).
      security:
      - session:
        - workspace:manage
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Удаление запланировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
              example:
                status: scheduled
                purge_before: '2026-11-11T16:30:00Z'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '428':
          description: 'Ошибка, коды: precondition_required'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                precondition_required:
                  value:
                    type: urn:problem-type:medarchive:precondition_required
                    title: Обновите страницу и повторите
                    status: 428
                    code: precondition_required
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '412':
          description: 'Ошибка, коды: version_conflict'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                version_conflict:
                  value:
                    type: urn:problem-type:medarchive:version_conflict
                    title: Документ изменился в другой вкладке. Обновите, чтобы увидеть новую версию
                    status: 412
                    code: version_conflict
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '401':
          description: 'Ошибка, коды: unauthenticated'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unauthenticated:
                  value:
                    type: urn:problem-type:medarchive:unauthenticated
                    title: Сессия закончилась. Откройте архив ключом доступа
                    status: 401
                    code: unauthenticated
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
