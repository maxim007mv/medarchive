openapi: 3.1.0
info:
  title: Медархив API
  version: 1.0.0
  description: 'Контракт v1. Правила и обоснования: 01_common/06-api-contract.md. Ошибки RFC 9457, идемпотентность по Idempotency-Key, оптимистичная конкурентность по ETag/If-Match, лимиты с 429 + Retry-After
    и заголовками RateLimit. Вебхуков в v1 нет.'
servers:
- url: /
  description: Тот же домен, что и веб-клиент
security:
- session: []
tags:
- name: workspaces
- name: session
- name: sessions
- name: workspace
- name: documentTypes
- name: uploads
- name: suggestions
- name: documents
- name: exports
- name: health
paths:
  /api/v1/workspaces:
    post:
      operationId: workspaces.create
      summary: Создать архив, сессию и принять согласие
      tags:
      - workspaces
      description: 'Без consent.accepted = true ответ 422 validation_error (схема требует const true), архив не создаётся. Повтор с тем же Idempotency-Key возвращает тот же архив и тот же access_key, но
        новую сессию: новые Set-Cookie и csrf_token (ADR-045).'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
            example:
              consent:
                policy_version: '2026-11-10'
                accepted: true
              timezone: Europe/Moscow
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCreated'
              example:
                workspace:
                  id: 01930c6e-7b1a-7c2e-9f4e-3a5d2b1c0e9f
                  created_at: '2026-11-10T16:00:02Z'
                  document_count: 0
                access_key: 7K3M-Q9TB-2XRA-HC4D-P8WN-6YFE
                csrf_token: b9V4
                scopes:
                - documents:read
                - documents:write
                - exports:create
                - workspace:manage
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '422':
          description: 'Ошибка, коды: validation_error (в том числе consent.accepted не true), idempotency_key_reused'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation_error:
                  value:
                    type: urn:problem-type:medarchive:validation_error
                    title: Проверьте выделенные поля
                    status: 422
                    code: validation_error
                    request_id: req_01930c9a
                idempotency_key_reused:
                  value:
                    type: urn:problem-type:medarchive:idempotency_key_reused
                    title: Не получилось сохранить. Попробуйте ещё раз
                    status: 422
                    code: idempotency_key_reused
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '400':
          description: 'Ошибка, коды: idempotency_key_missing'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotency_key_missing:
                  value:
                    type: urn:problem-type:medarchive:idempotency_key_missing
                    title: Не получилось сохранить. Попробуйте ещё раз
                    status: 400
                    code: idempotency_key_missing
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '409':
          description: 'Ошибка, коды: idempotency_in_progress'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotency_in_progress:
                  value:
                    type: urn:problem-type:medarchive:idempotency_in_progress
                    title: Сохраняем, подождите секунду
                    status: 409
                    code: idempotency_in_progress
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '429':
          description: 'Ошибка, коды: rate_limited'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                rate_limited:
                  value:
                    type: urn:problem-type:medarchive:rate_limited
                    title: Слишком много действий подряд. Повторите через N с
                    status: 429
                    code: rate_limited
                    request_id: req_01930c9a
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '500':
          description: 'Ошибка, коды: internal'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                internal:
                  value:
                    type: urn:problem-type:medarchive:internal
                    title: Не получилось выполнить действие. Попробуйте ещё раз через минуту
                    status: 500
                    code: internal
                    request_id: req_01930c9a
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
