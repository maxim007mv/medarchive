components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-ma_sid
      description: 'BFF-сессия. Скоупы: documents:read, documents:write, exports:create, workspace:manage. Изменяющие запросы требуют X-CSRF-Token.'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - validation_error
          - title_required
          - title_too_long
          - date_invalid
          - date_in_future
          - date_range_invalid
          - note_too_long
          - type_unknown
          - not_pdf
          - file_too_large
          - pdf_unreadable
          - pdf_encrypted
          - upload_not_found
          - upload_expired
          - upload_incomplete
          - not_found
          - precondition_required
          - version_conflict
          - idempotency_key_missing
          - idempotency_key_reused
          - idempotency_in_progress
          - invalid_page_token
          - unauthenticated
          - access_key_invalid
          - csrf_failed
          - scope_insufficient
          - consent_required
          - rate_limited
          - ai_busy
          - ai_unavailable
          - storage_unavailable
          - internal
        request_id:
          type: string
        etag:
          type: string
          description: Текущий ETag при version_conflict
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              code:
                type: string
              title:
                type: string
            required:
            - pointer
            - code
            - title
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
    WorkspaceCreate:
      type: object
      properties:
        consent:
          type: object
          properties:
            policy_version:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            accepted:
              type: boolean
              const: true
          required:
          - policy_version
          - accepted
          additionalProperties: false
        timezone:
          type: string
          maxLength: 64
      required:
      - consent
      additionalProperties: false
    WorkspaceCreated:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        access_key:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){5}$
        csrf_token:
          type: string
        scopes: &id005
          type: array
          items:
            type: string
            enum:
            - documents:read
            - documents:write
            - exports:create
            - workspace:manage
      required:
      - workspace
      - access_key
      - csrf_token
      - scopes
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id: &id004
          type: string
          format: uuid
        created_at: &id003
          type: string
          format: date-time
        document_count:
          type: integer
          minimum: 0
        total_bytes:
          type: integer
          minimum: 0
        undated_count:
          type: integer
          minimum: 0
        consent:
          type: object
          properties:
            policy_version:
              type: string
            accepted_at: *id003
          additionalProperties: false
      required:
      - id
      - created_at
      - document_count
      additionalProperties: false
    Session:
      type: object
      properties:
        workspace_id: *id004
        csrf_token:
          type: string
        scopes: *id005
        idle_expires_at: *id003
        timezone:
          type: string
      required:
      - workspace_id
      - csrf_token
      - scopes
      additionalProperties: false
    AccessKeyLogin:
      type: object
      properties:
        access_key:
          type: string
          minLength: 24
          maxLength: 29
      required:
      - access_key
      additionalProperties: false
    AccessKeyIssued:
      type: object
      properties:
        access_key:
          type: string
        revoked_previous:
          type: boolean
      required:
      - access_key
      - revoked_previous
      additionalProperties: false
    DeletionScheduled:
      type: object
      properties:
        status:
          type: string
          const: scheduled
        purge_before: *id003
      required:
      - status
      - purge_before
      additionalProperties: false
    DocumentTypeList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              code: &id006
                type: string
                enum:
                - analysis
                - conclusion
                - other
              title:
                type: string
            required:
            - code
            - title
            additionalProperties: false
      required:
      - items
      additionalProperties: false
    UploadCreate:
      type: object
      properties:
        original_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Имя файла на устройстве пользователя; хранится зашифрованным и возвращается в Document.file.original_name
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        content_type:
          type: string
          const: application/pdf
      required:
      - original_name
      - size_bytes
      - content_type
      additionalProperties: false
    Upload:
      type: object
      properties:
        upload_id: *id004
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        max_bytes:
          type: integer
        expires_at: *id003
      required:
      - upload_id
      - url
      - fields
      - max_bytes
      - expires_at
      additionalProperties: false
    SuggestionCreate:
      type: object
      properties:
        upload_id: *id004
      required:
      - upload_id
      additionalProperties: false
    Suggestion:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
          enum:
          - analysis
          - conclusion
          - other
          - null
        document_date: &id007
          type:
          - string
          - 'null'
          format: date
        evidence:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
          const: pdf_text_layer
        model:
          type: string
      required:
      - title
      - type
      - document_date
      - source
      additionalProperties: false
    DocumentCreate:
      type: object
      properties:
        upload_id: *id004
        title:
          type: string
          minLength: 1
          maxLength: 200
        type: *id006
        document_date: *id007
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
      required:
      - upload_id
      - title
      - type
      additionalProperties: false
    DocumentPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type: *id006
        document_date: *id007
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
      additionalProperties: false
      minProperties: 1
    FileInfo:
      type: object
      properties:
        original_name:
          type: string
        size_bytes:
          type: integer
        page_count:
          type:
          - integer
          - 'null'
      required:
      - original_name
      - size_bytes
      additionalProperties: false
    Document:
      type: object
      properties:
        id: *id004
        title:
          type: string
        type: *id006
        document_date: *id007
        uploaded_at: *id003
        updated_at: *id003
        note:
          type:
          - string
          - 'null'
        file:
          $ref: '#/components/schemas/FileInfo'
        version:
          type: integer
          minimum: 1
      required:
      - id
      - title
      - type
      - document_date
      - uploaded_at
      - updated_at
      - note
      - file
      - version
      additionalProperties: false
    DocumentListItem:
      type: object
      properties:
        id: *id004
        title:
          type: string
        type: *id006
        document_date: *id007
        uploaded_at: *id003
        has_note:
          type: boolean
        size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        version:
          type: integer
      required:
      - id
      - title
      - type
      - document_date
      - uploaded_at
      - has_note
      - size_bytes
      - version
      additionalProperties: false
    DocumentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItem'
        total:
          type: integer
        matched:
          type: integer
        undated_excluded:
          type: integer
        next_page_token:
          type: string
      required:
      - items
      - total
      - matched
      - undated_excluded
      - next_page_token
      additionalProperties: false
    DocumentFilter:
      type: object
      properties:
        q:
          type: string
          maxLength: 100
          pattern: ^\s*$|^\s*(\S\s*){3,}$
          description: Подстрока в названии без учёта регистра и ё/е (ADR-046). Пустая строка или только пробелы = без поиска; 1 или 2 непробельных символа = 422 validation_error; от 3 непробельных символов
            = поиск
        type:
          type: array
          items: *id006
        date_field:
          type: string
          enum:
          - document
          - uploaded
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        undated:
          type: boolean
      additionalProperties: false
    ExportCreate:
      type: object
      properties:
        scope:
          type: string
          enum:
          - all
          - filtered
          - selected
        filter:
          $ref: '#/components/schemas/DocumentFilter'
        document_ids:
          type: array
          items: *id004
          minItems: 1
          maxItems: 5000
      required:
      - scope
      additionalProperties: false
    Export:
      type: object
      properties:
        id: *id004
        scope:
          type: string
        document_count:
          type: integer
        total_bytes:
          type: integer
        content_url:
          type: string
        expires_at: *id003
      required:
      - id
      - scope
      - document_count
      - total_bytes
      - content_url
      - expires_at
      additionalProperties: false
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: 'Один ключ на одно намерение пользователя; хранится 24 ч (draft-ietf-httpapi-idempotency-key-header). Повтор с тем же телом возвращает сохранённый ответ с Idempotent-Replayed: true (ADR-045)'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      example: '"v3"'
      description: Без заголовка 428, при несовпадении 412
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Значение из GET /api/v1/session
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: *id004
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
        pattern: ^\s*$|^\s*(\S\s*){3,}$
      description: Подстрока в названии без учёта регистра и ё/е (ADR-046). Пустая строка или только пробелы = без поиска; 1 или 2 непробельных символа = 422 validation_error; от 3 непробельных символов
        = поиск
    Type:
      name: type
      in: query
      required: false
      schema:
        type: array
        items: *id006
      description: Коды типов
      style: form
      explode: false
    DateField:
      name: date_field
      in: query
      required: false
      schema:
        type: string
        enum:
        - document
        - uploaded
        default: document
      description: По какой дате фильтровать
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Начало периода, включительно
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Конец периода, включительно
    Undated:
      name: undated
      in: query
      required: false
      schema:
        type: boolean
      description: Только документы без даты документа. При undated=true параметры date_field, from и to игнорируются, undated_excluded = 0
    Tz:
      name: tz
      in: query
      required: false
      schema:
        type: string
      description: IANA-зона для границ суток при date_field=uploaded
      example: Europe/Moscow
    OrderBy:
      name: order_by
      in: query
      required: false
      schema:
        type: string
        enum:
        - document_date desc
        - uploaded_at desc
        default: document_date desc
      description: AIP-132; без даты всегда последние, тай-брейк uploaded_at по возрастанию, затем id
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Больше 200 = 422 validation_error (значение не урезается)
    PageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: 'Непрозрачный курсор (AIP-158). В токен входит хэш q, type, date_field, from, to, undated, tz и order_by: токен с другим значением любого из них даёт 400 invalid_page_token'
  headers:
    NoStore:
      schema:
        type: string
        const: no-store
      description: Персональные данные не кэшируются
    ETag:
      schema:
        type: string
      example: '"v4"'
    RetryAfter:
      schema:
        type: integer
      description: Секунды до повтора (RFC 9110)
    RateLimit:
      schema:
        type: string
      example: '"burst";r=27;t=41'
      description: На каждом ответе лимитируемого маршрута (все маршруты, кроме /healthz и /readyz)
    RateLimitPolicy:
      schema:
        type: string
      example: '"burst";q=30;w=60'
      description: 'Квота маршрута из 06-api-contract.md, раздел 3. Лимит «общий» = 300 запросов в минуту на сессию: "general";q=300;w=60'
    SetSession:
      schema:
        type: string
      example: __Host-ma_sid=...; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=2592000
    RequestId:
      schema:
        type: string
        maxLength: 64
      example: req_01930c9a
      description: Есть в каждом ответе; тот же request_id в теле ошибки и в логах
    IdempotentReplayed:
      schema:
        type: string
        const: 'true'
      description: 'Только в ответе на повтор с тем же Idempotency-Key и тем же телом: сохранённый статус и тело первой попытки (ADR-045)'
    ContentRange:
      required: true
      schema:
        type: string
      example: bytes 0-65535/79114
    PublicMaxAge:
      schema:
        type: string
        const: public, max-age=3600
      description: Справочник не содержит персональных данных и кэшируется на 1 час
