  /api/v1/sessions:
    post:
      operationId: sessions.create
      summary: Открыть архив по ключу доступа
      tags:
      - sessions
      description: 'Лимит 5 попыток за 15 минут на IP: пятая неверная попытка получает 401 access_key_invalid, шестая и следующие до конца окна получают 429 rate_limited с Retry-After. Время ответа одинаковое
        для неизвестного lookup_id и неверного секрета.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessKeyLogin'
            example:
              access_key: 7K3M-Q9TB-2XRA-HC4D-P8WN-6YFE
      responses:
        '201':
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
