  /api/v1/uploads:
    post:
      operationId: uploads.create
      summary: Получить presigned POST для PDF
      tags:
      - uploads
      description: 'Клиент отправляет multipart/form-data прямо в url с полями fields и файлом последним полем. Политика содержит content-length-range 1..20971520 и точный key. Три срока: подпись политики
        действует 15 минут (expires_at); строка uploads живёт 1 час, после этого POST /api/v1/documents с этим upload_id даёт 410 upload_expired; правило жизненного цикла бакета карантина удаляет объект
        через 1 день.'
      security:
      - session:
        - documents:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
            example:
              original_name: 01-general-blood-test.pdf
              size_bytes: 79114
              content_type: application/pdf
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              example:
                upload_id: 01930c70-1f2a-7d3b-8c4d-5e6f7a8b9c0d
                url: https://storage.yandexcloud.net/ma-quarantine
                fields:
                  key: q/01930c6e/01930c70.bin
                  Content-Type: application/pdf
                  policy: eyJleHBpcmF0aW9uIjoi
                  x-amz-algorithm: AWS4-HMAC-SHA256
                  x-amz-credential: AKID/20261110/ru-central1/s3/aws4_request
                  x-amz-date: 20261110T160010Z
                  x-amz-signature: 9f2c
                max_bytes: 20971520
                expires_at: '2026-11-10T16:15:10Z'
          headers:
